<!DOCTYPE html>
<html lang="nl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Plukklaer Kassa</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="app">
            <header class="app-header">
                <div class="app-brand">
                    <span class="logo">🌸</span>
                    <div class="app-title-group">
                        <h1>Plukklaer</h1>
                        <span class="app-version">v2</span>
                    </div>
                </div>
                <button class="header-action" id="history-toggle" aria-label="Open dagoverzicht">📥</button>
            </header>

            <main class="flower-panel">
                <div id="touch"></div>
            </main>

            <!-- Sticky bottom bar -->
            <div class="bottom-bar">
                <div class="bottom-total">
                    <span class="bottom-label">Totaal</span>
                    <span class="total-value">€0.00</span>
                </div>
                <button class="btn-open-receipt" id="receipt-toggle">
                    Bestelling
                    <span id="receipt-item-count" class="item-count-badge"></span>
                </button>
            </div>

            <!-- Receipt sheet overlay -->
            <div class="receipt-overlay" id="receipt-overlay">
                <div class="receipt-sheet">
                    <div class="receipt-sheet-header">
                        <h2>Bestelling</h2>
                        <button class="btn-close-receipt" id="close-receipt">✕</button>
                    </div>
                    <ul id="item-list" class="item-list">
                        <li class="empty-state">Nog niets toegevoegd</li>
                    </ul>
                    <div class="receipt-divider"></div>
                    <div class="receipt-total-row">
                        <span>Totaal</span>
                        <span class="total-value receipt-total-value">€0.00</span>
                    </div>
                    <button class="btn-checkout" id="checkout-button">Afrekenen</button>
                    <button onclick="resetAmount()" class="btn-reset">🗑 Leegmaken</button>
                </div>
            </div>
            <div class="checkout-overlay" id="checkout-overlay">
                <div class="checkout-dialog">
                    <span class="checkout-label">Te betalen</span>
                    <span class="checkout-amount" id="checkout-amount">€0.00</span>
                    <img class="checkout-qr" src="qr-code.png" alt="QR-code om te betalen">
                    <div class="checkout-actions">
                        <button class="btn-edit-checkout" id="edit-checkout">Bewerken</button>
                        <button class="btn-close-checkout" id="close-checkout">Nieuwe bestelling</button>
                    </div>
                </div>
            </div>
            <div class="history-overlay" id="history-overlay">
                <div class="history-screen">
                    <div class="history-topbar">
                        <button class="btn-history-back" id="close-history" aria-label="Terug naar kassa">← Kassa</button>
                        <button class="btn-history-mail" id="history-email-button" aria-label="Mail dagoverzicht">✉️ Mail</button>
                    </div>
                    <div class="history-day-nav">
                        <button class="history-arrow" id="history-prev-day" aria-label="Vorige opgeslagen dag">←</button>
                        <div class="history-day-heading">
                            <span class="history-day-label">Dagoverzicht</span>
                            <h2 id="history-date-label">Vandaag</h2>
                        </div>
                        <button class="history-arrow" id="history-next-day" aria-label="Volgende opgeslagen dag">→</button>
                    </div>
                    <div class="history-summary">
                        <article class="history-summary-card">
                            <span class="history-summary-label">Bestellingen</span>
                            <strong id="history-order-count">0</strong>
                        </article>
                        <article class="history-summary-card">
                            <span class="history-summary-label">Bloemen</span>
                            <strong id="history-total-items">0</strong>
                        </article>
                        <article class="history-summary-card">
                            <span class="history-summary-label">Omzet</span>
                            <strong id="history-total-revenue">€0.00</strong>
                        </article>
                    </div>
                    <div class="history-orders">
                        <ul class="history-order-list" id="history-order-list"></ul>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
